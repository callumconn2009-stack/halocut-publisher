name: insights
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: post-due
jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull analytics and update the dashboard
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python insights.py
      - name: Save
        run: |
          git config user.name "trial-lab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "insights: update dashboard" && git push)
